<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>외래진료 예약 | 속안심내과</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header><div class="brand"><b class="cross">+</b><div><strong>속안심내과</strong><small>SOKANSIM INTERNAL MEDICINE</small></div></div><span class="badge">전용 예약</span></header>
  <section class="hero">
    <p class="eyebrow">속안심내과 전용</p><h1>외래진료 예약</h1>
    <p class="intro">진료 후 다음 내원일을 안내받은 환자분을 위한 예약 신청 화면입니다.</p>
    <div class="doctor"><div class="doctor-logo"><img src="logo.png" alt="속안심내과 S 로고"></div><div><span>담당 의료진</span><strong>오지혜 원장님</strong><p>외래진료 예약</p></div></div>
  </section>
  <form id="reservationForm">
    <section class="card"><div class="title"><span>01</span><h2>환자 정보</h2></div>
      <label>성함 *<input id="patientName" type="text" maxlength="20" placeholder="성함을 입력해 주세요" required></label>
      <label>생년월일 *<input id="birthDate" type="text" maxlength="8" inputmode="numeric" placeholder="예: 19850312" required><small>숫자 8자리</small></label>
      <label>휴대전화번호 뒤 4자리 *<input id="phoneLast4" type="text" maxlength="4" inputmode="numeric" placeholder="예: 1234" required><small>예약 확인용</small></label>
    </section>
    <section class="card"><div class="title"><span>02</span><h2>예약 희망일</h2></div>
      <label>예약 희망 날짜 *</label>
      <div class="calendar">
        <div class="calendar-head"><button type="button" id="previousMonth">‹</button><strong id="calendarTitle"></strong><button type="button" id="nextMonth">›</button></div>
        <div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div id="calendarDays" class="days"></div>
      </div>
      <input type="hidden" id="appointmentDate">
      <p id="dateGuide" class="guide">회색 날짜는 예약할 수 없습니다.</p>
    </section>
    <section class="card"><div class="title"><span>03</span><h2>시간대 선택</h2></div><div id="timeArea" class="empty">먼저 예약 희망일을 선택해 주세요.</div></section>
    <label class="privacy"><input type="checkbox" id="privacyConsent"><span><strong>개인정보 수집·이용에 동의합니다. *</strong><small>예약 확인을 위해 성함, 생년월일, 연락처 뒤 4자리, 희망 일시를 수집합니다.</small></span></label>
    <p id="errorMessage" class="error"></p>
    <button id="submitButton" class="submit" type="submit">예약 신청하기 <span>→</span></button>
  </form>
  <section id="successScreen" class="success hidden"><div class="check">✓</div><h2>예약이 완료되었습니다.</h2><div id="reservationSummary" class="summary"></div></section>
  <footer>환자를 위한 진심, 속안심내과</footer>
</main>
<script src="script.js"></script>
</body>
</html>
