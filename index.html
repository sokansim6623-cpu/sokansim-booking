<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="속안심내과 외래진료 예약">
  <title>외래진료 예약 | 속안심내과</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <header class="header">
      <div class="hospital-logo">
        <span class="cross">+</span>

        <div>
          <strong>속안심내과</strong>
          <small>SOKANSIM INTERNAL MEDICINE</small>
        </div>
      </div>

      <span class="reservation-badge">전용 예약</span>
    </header>

    <section class="intro-card">
      <p class="eyebrow">속안심내과 전용</p>
      <h1>외래진료 예약</h1>

      <p class="intro-text">
        진료 후 다음 내원일을 안내받은 환자분을 위한 예약 신청 화면입니다.
      </p>

      <div class="doctor-card">
        <div class="doctor-logo">
          <img src="logo.png" alt="속안심내과 S 로고">
        </div>

        <div>
          <span>담당 의료진</span>
          <strong>오지혜 원장님</strong>
          <p>외래진료 예약</p>
        </div>
      </div>
    </section>

    <form id="reservationForm">
      <section class="form-card">
        <div class="section-title">
          <span>01</span>
          <h2>환자 정보</h2>
        </div>

        <label>
          성함 *
          <input
            type="text"
            id="patientName"
            maxlength="20"
            placeholder="성함을 입력해 주세요"
            required
          >
        </label>

        <label>
          생년월일 *
          <input
            type="text"
            id="birthDate"
            maxlength="8"
            inputmode="numeric"
            placeholder="예: 19850312"
            required
          >
          <small>숫자 8자리</small>
        </label>

        <label>
          휴대전화번호 뒤 4자리 *
          <input
            type="text"
            id="phoneLast4"
            maxlength="4"
            inputmode="numeric"
            placeholder="예: 1234"
            required
          >
          <small>예약 확인용</small>
        </label>
      </section>

      <section class="form-card">
        <div class="section-title">
          <span>02</span>
          <h2>예약 희망일</h2>
        </div>

        <label>
          예약 희망 날짜 *
          <input type="date" id="appointmentDate" required>
        </label>

        <p id="dateGuide" class="guide">
          날짜 입력칸을 누르면 달력이 열립니다. 당일 예약은 신청할 수 없습니다.
        </p>
      </section>

      <section class="form-card">
        <div class="section-title">
          <span>03</span>
          <h2>시간대 선택</h2>
        </div>

        <div id="timeArea" class="empty-time">
          먼저 예약 희망일을 선택해 주세요.
        </div>
      </section>

      <label class="privacy">
        <input type="checkbox" id="privacyConsent" required>

        <span>
          <strong>개인정보 수집·이용에 동의합니다. *</strong>
          <small>
            예약 확인을 위해 성함, 생년월일, 연락처 뒤 4자리,
            희망 일시를 수집합니다.
          </small>
        </span>
      </label>

      <p id="errorMessage" class="error-message"></p>

      <button type="submit" id="submitButton">
        예약 신청하기
        <span>→</span>
      </button>
    </form>

    <section id="successScreen" class="success-screen hidden">
      <div class="success-icon">✓</div>

      <h2>예약이 완료되었습니다.</h2>

      <div id="reservationSummary" class="reservation-summary"></div>
    </section>

    <footer>
      환자를 위한 진심, 속안심내과
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
